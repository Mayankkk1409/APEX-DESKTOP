    <script>(function(){try{var m=localStorage.getItem("apex_theme");var mode=m==="light"||m==="dark"||m==="system"?m:"dark";var eff=mode==="system"?(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):mode;document.documentElement.dataset.theme=eff;document.documentElement.style.colorScheme=eff;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
