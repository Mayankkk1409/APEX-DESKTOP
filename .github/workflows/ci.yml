name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash infra/secret-scan.sh
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source /path --no-git --verbose

  backend:
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit + integration
        env:
          APP_ENV: development
          APP_SECRET_KEY: ci-secret
          DATABASE_URL: sqlite+aiosqlite:///./test_apex.db
          AUTOFILL_2FA: "true"
        run: pytest -q --cov=app --cov-report=term-missing

  frontend-unit:
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit
        run: npm test

  # Playwright: install chromium matching the runner arch (ubuntu-latest = linux x64).
  # Local macOS: use the same arch for Node and browsers — see frontend/.verify/README.md.
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend deps
        run: pip install -r backend/requirements.txt
      - name: Frontend deps
        working-directory: frontend
        run: npm install && npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend
        env:
          CI: "true"
          # Explicit defaults (playwright.config.ts); override only if the runner collides.
          E2E_API_PORT: "8000"
          E2E_VITE_PORT: "5174"
        run: npm run test:e2e
